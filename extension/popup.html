<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AutoBiz AI Collector</title>
  <style>
    :root {
      --bg-page: #FBFBFA;
      --bg-surface: #FFFFFF;
      --ink-primary: #111827;
      --ink-secondary: #4B5563;
      --ink-muted: #6B7280;
      --border-hairline: #E5E7EB;
      --accent-burgundy: #7F1D1D;
      --accent-bronze: #92400E;
      --status-ok: #166534;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: var(--bg-page);
      color: var(--ink-primary);
      padding: 16px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-hairline);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      background: var(--ink-primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-radius: 4px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-primary);
      letter-spacing: -0.01em;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--ink-secondary);
    }
    .version-tag {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-burgundy);
      border: 1px solid var(--border-hairline);
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--bg-surface);
    }
    .tabs-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border-hairline);
      background: #F3F4F6;
      padding: 2px;
      border-radius: 4px;
      margin-bottom: 14px;
    }
    .tab-btn {
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      background: transparent;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
    .field-group {
      margin-bottom: 10px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      margin-bottom: 4px;
    }
    .input, .select, .textarea {
      width: 100%;
      padding: 7px 9px;
      font-size: 12px;
      font-family: inherit;
      color: var(--ink-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 4px;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--ink-primary);
    }
    .textarea {
      height: 68px;
      resize: vertical;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--ink-primary);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #1F2937;
    }
    .btn-accent {
      background: var(--accent-burgundy);
      color: #FFFFFF;
    }
    .btn-accent:hover {
      background: #991B1B;
    }
    .btn-outline {
      background: var(--bg-surface);
      color: var(--ink-primary);
      border-color: var(--border-hairline);
    }
    .btn-outline:hover {
      background: #F3F4F6;
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px 10px;
      font-size: 11.5px;
      border-radius: 4px;
      border: 1px solid var(--border-hairline);
      display: none;
      word-break: break-word;
    }
    .status-msg.loading {
      display: block;
      background: #FEF3C7;
      color: var(--accent-bronze);
      border-color: #FDE68A;
    }
    .status-msg.success {
      display: block;
      background: #F0FDF4;
      color: var(--status-ok);
      border-color: #BBF7D0;
    }
    .status-msg.error {
      display: block;
      background: #FEF2F2;
      color: var(--accent-burgundy);
      border-color: #FECACA;
    }
    .result-box {
      margin-top: 10px;
      padding: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 4px;
      display: none;
      font-size: 11.5px;
    }
    .result-box.visible {
      display: block;
    }
    .shortlink-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F9FAFB;
      border: 1px solid var(--border-hairline);
      padding: 6px 8px;
      border-radius: 3px;
      margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--accent-burgundy);
      font-weight: 600;
    }
    .footer-bar {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-mark">AB</div>
      <div>
        <div class="brand-title">AutoBiz AI Collector</div>
        <div class="brand-sub">Thu thập Đa ngành &amp; Affiliate FinTech</div>
      </div>
    </div>
    <span class="version-tag">v2.0</span>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="tab-collect">Thu thập &amp; Tạo link</button>
    <button class="tab-btn" data-tab="tab-settings">Kết nối Máy chủ</button>
  </div>

  <!-- TAB 1: THU THẬP ĐA NGÀNH & TẠO SHORTLINK -->
  <div id="tab-collect" class="tab-pane active">
    <div class="field-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <label class="label" style="margin-bottom:0;">Tên mặt hàng:</label>
        <button id="btnGrabCurrentTab" type="button" style="background:none; border:none; font-size:11px; color:var(--accent-burgundy); font-weight:600; cursor:pointer;">[Lấy từ Tab hiện tại]</button>
      </div>
      <input type="text" id="prodNameInput" class="input" placeholder="VD: Tai nghe Bluetooth ANC Pro / Áo Hoodie...">
    </div>

    <div class="field-group row-2">
      <div>
        <label class="label">Ngành hàng (5 nhóm):</label>
        <select id="prodCategoryInput" class="select">
          <option value="accessories">Phụ kiện công nghệ</option>
          <option value="fashion">Thời trang Gen Z</option>
          <option value="home">Gia dụng thông minh</option>
          <option value="fmcg">Mỹ phẩm &amp; FMCG</option>
          <option value="tech">Thiết bị Điện tử</option>
        </select>
      </div>
      <div>
        <label class="label">Giá bán lẻ (VNĐ):</label>
        <input type="number" id="prodPriceInput" class="input" placeholder="299000" value="299000">
      </div>
    </div>

    <div class="field-group row-2">
      <div>
        <label class="label">Hoa hồng Affiliate (%):</label>
        <input type="number" id="prodCommInput" class="input" placeholder="12" value="12" min="1" max="80">
      </div>
      <div>
        <label class="label">Kênh chiến dịch chính:</label>
        <select id="prodChannelInput" class="select">
          <option value="tiktok">TikTok Video</option>
          <option value="facebook">Facebook Fanpage</option>
          <option value="zalo">Zalo OA</option>
          <option value="shopee">Shopee Feed</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="label">Link gốc sản phẩm (Shopee / TikTok / Kho sỉ):</label>
      <input type="url" id="prodUrlInput" class="input" placeholder="https://shopee.vn/product/...">
    </div>

    <div class="field-group">
      <label class="label">Mô tả thô / Điểm nổi bật (USP):</label>
      <textarea id="rawTextInput" class="textarea" placeholder="Nhập thông số chính, chất liệu, ưu đãi để Gemini AI sinh 4 bản nội dung..."></textarea>
    </div>

    <div class="actions">
      <button id="btnSaveCatalog" class="btn btn-primary">1. Lưu vào Kho Hàng Đa Ngành</button>
      <button id="btnGenerateOmni" class="btn btn-accent">2. Sinh 4 Kênh &amp; Rút gọn Link (/r/:code)</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div id="resultBox" class="result-box">
      <div style="font-weight:600; color:var(--ink-primary);">Link Affiliate Rút gọn:</div>
      <div class="shortlink-bar">
        <span id="shortlinkText">-</span>
        <button id="btnCopyShortlink" type="button" style="background:none; border:none; cursor:pointer; font-size:11px; font-weight:700; color:var(--ink-primary);">SAO CHÉP</button>
      </div>
      <div id="omniSummary" style="margin-top:8px; color:var(--ink-secondary); font-size:11px;"></div>
    </div>

    <div class="footer-bar">
      <span id="quickStatusText" style="font-size:11px; color:var(--ink-muted);">Máy chủ: autobiz-ai-seven.vercel.app</span>
      <button id="openFullAppBtn" class="btn btn-outline" style="width:auto; padding:5px 10px; font-size:11px;">Mở WebApp</button>
    </div>
  </div>

  <!-- TAB 2: KẾT NỐI MÁY CHỦ -->
  <div id="tab-settings" class="tab-pane">
    <div class="field-group">
      <label class="label">URL Máy chủ AutoBiz AI:</label>
      <input type="url" id="backendUrlInput" class="input" value="https://autobiz-ai-seven.vercel.app" placeholder="https://autobiz-ai-seven.vercel.app">
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button type="button" id="btnPresetVercel" class="btn btn-outline" style="padding:5px 8px; font-size:11px;">Dùng Vercel Public</button>
        <button type="button" id="btnPresetLocal" class="btn btn-outline" style="padding:5px 8px; font-size:11px;">Dùng Local (3000)</button>
      </div>
    </div>

    <div class="field-group">
      <label class="label">Mã định danh SubID Affiliate:</label>
      <input type="text" id="subIdInput" class="input" value="vuonggia" placeholder="vuonggia">
    </div>

    <button id="saveBtn" class="btn btn-primary" style="margin-top:6px;">Lưu Cấu Hình Kết Nối</button>

    <div id="connectionStatus" style="margin-top:12px; font-size:11.5px; color:var(--ink-secondary); padding:8px; background:var(--bg-surface); border:1px solid var(--border-hairline); border-radius:4px;">
      Đang kiểm tra kết nối máy chủ...
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
